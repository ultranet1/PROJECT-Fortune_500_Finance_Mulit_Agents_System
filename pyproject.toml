[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agents"
version = "0.1.0"
description = "A LangGraph multi-agent system for Fortune-500 company research, stock analysis, and visualization."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
